name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, test-cicd ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./HyperAutomation
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/hyperautomation-equipe-1:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hyperautomation-equipe-1:latest